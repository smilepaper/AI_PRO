<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面板一：隔空簡報播放器</title>
    <style>
        :root { --bg: #fdf6e3; --text: #333; --accent: #2c858d; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; user-select: none;
        }
        .upload-area {
            position: absolute; top: 20px; left: 20px; z-index: 10;
        }
        .upload-label {
            background: #fff; border: 2px solid var(--accent); color: var(--accent);
            padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .upload-label:hover { background: var(--accent); color: #fff; }
        
        .slide-container {
            width: 85%; height: 80%; background: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            cursor: pointer; /* 點擊可以換頁 */
        }
        .slide-image {
            max-width: 100%; max-height: 100%; object-fit: contain;
            display: none;
        }
        .slide-image.active { display: block; animation: fade 0.3s ease-in; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        .placeholder {
            color: #aaa; text-align: center;
        }
        .placeholder h2 { margin-bottom: 10px; color: var(--accent); }

        .controls {
            position: absolute; bottom: 20px; display: flex; gap: 20px;
            align-items: center; background: rgba(255,255,255,0.9);
            padding: 8px 24px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .btn {
            background: none; border: none; font-size: 1.2rem;
            color: var(--text); cursor: pointer; font-weight: bold;
        }
        .btn:hover { color: var(--accent); }
        .page-indicator { font-family: monospace; font-size: 1.1rem; }
    </style>
</head>
<body>

    <div class="upload-area">
        <label class="upload-label">
            載入簡報圖片 (多選)
            <input type="file" id="file-input" accept="image/*" multiple style="display:none">
        </label>
    </div>

    <div class="slide-container" id="slide-container" onclick="nextSlide()">
        <div class="placeholder" id="placeholder">
            <h2>尚未載入簡報</h2>
            <p>請點擊左上角載入圖片，或透過手勢 `One` / `Three` 翻頁。<br>您可以搭配 `Pinkie` 畫筆在畫面上標註！</p>
        </div>
    </div>

    <div class="controls" id="controls" style="display:none;">
        <button class="btn" onclick="prevSlide(event)">◄ 上一頁 (One)</button>
        <span class="page-indicator" id="page-indicator">0 / 0</span>
        <button class="btn" onclick="nextSlide(event)">下一頁 (Three) ►</button>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const slideContainer = document.getElementById('slide-container');
        const placeholder = document.getElementById('placeholder');
        const controls = document.getElementById('controls');
        const pageIndicator = document.getElementById('page-indicator');

        let slides = [];
        let currentIndex = 0;

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // 清除舊的
            slideContainer.querySelectorAll('img').forEach(img => img.remove());
            slides = [];
            currentIndex = 0;
            placeholder.style.display = 'none';

            files.forEach((file, index) => {
                const img = document.createElement('img');
                img.className = 'slide-image';
                img.src = URL.createObjectURL(file);
                slideContainer.appendChild(img);
                slides.push(img);
            });

            updateView();
            controls.style.display = 'flex';
        });

        function updateView() {
            if (slides.length === 0) return;
            slides.forEach((img, idx) => {
                img.classList.toggle('active', idx === currentIndex);
            });
            pageIndicator.textContent = `${currentIndex + 1} / ${slides.length}`;
        }

        function nextSlide(e) {
            if (e) e.stopPropagation();
            if (slides.length === 0) return;
            currentIndex = (currentIndex + 1) % slides.length;
            updateView();
        }

        function prevSlide(e) {
            if (e) e.stopPropagation();
            if (slides.length === 0) return;
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            updateView();
        }

        // 接收來自外部的手勢翻頁指令
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'slide-action') {
                if (event.data.action === 'next') nextSlide();
                else if (event.data.action === 'prev') prevSlide();
            }
        });
    </script>
</body>
</html>
