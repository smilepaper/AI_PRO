<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>面板二：流體粒子視覺沙盒</title>
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
        }
        canvas {
            display: block;
        }
        .hud {
            position: absolute;
            top: 20px; right: 20px;
            color: #ff3366;
            font-family: monospace; font-size: 0.9rem;
            text-align: right;
            text-shadow: 0 0 5px #ff3366;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="hud" id="hud">
        PARTICLE_ENGINE: V2<br>
        GRAVITY: DYNAMIC
    </div>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let mouseX = width / 2;
        let mouseY = height / 2;
        let isTracking = false;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // 接收母視窗的手勢座標
        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'hand-track') {
                mouseX = event.data.x * width;
                mouseY = event.data.y * height;
                isTracking = true;
            }
        });

        // 粒子類別
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.baseSize = Math.random() * 2 + 1;
                this.color = `hsl(${Math.random() * 60 + 300}, 100%, 60%)`; // 粉紫藍色系
            }

            update() {
                // 如果有手勢追蹤，則產生排斥力或吸引力
                if (isTracking) {
                    const dx = mouseX - this.x;
                    const dy = mouseY - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const force = 10000 / (dist * dist + 1000); // 排斥力
                    
                    if (dist < 200) {
                        this.vx -= (dx / dist) * force;
                        this.vy -= (dy / dist) * force;
                    }
                }

                // 彈性摩擦力
                this.vx *= 0.95;
                this.vy *= 0.95;

                // 隨機擾動
                this.vx += (Math.random() - 0.5) * 0.5;
                this.vy += (Math.random() - 0.5) * 0.5;

                this.x += this.vx;
                this.y += this.vy;

                // 邊界回彈
                if (this.x < 0) { this.x = 0; this.vx *= -1; }
                if (this.x > width) { this.x = width; this.vx *= -1; }
                if (this.y < 0) { this.y = 0; this.vy *= -1; }
                if (this.y > height) { this.y = height; this.vy *= -1; }
            }

            draw() {
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const size = this.baseSize + speed * 0.5;
                
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        const particles = [];
        for (let i = 0; i < 1500; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)'; // 拖尾殘影效果
            ctx.fillRect(0, 0, width, height);
            
            ctx.globalCompositeOperation = 'lighter';
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }
            ctx.globalCompositeOperation = 'source-over';

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
