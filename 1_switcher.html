<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>面板一：網頁傳送門</title>
    <style>
        :root {
            --bg-color: #11131a;
            --accent-color: #9b7cff;
            --accent-green: #4ee0c1;
            --card-bg: rgba(30, 32, 45, 0.92);
            --text-main: #f5f5f7;
            --text-sub: #b7b7c5;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at top left, rgba(155, 124, 255, 0.18), transparent 35%),
                radial-gradient(circle at bottom right, rgba(78, 224, 193, 0.12), transparent 35%),
                var(--bg-color);
            color: var(--text-main);
            font-family: "Segoe UI", "Noto Sans TC", Roboto, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .portal-card {
            position: relative;
            background: var(--card-bg);
            padding: 42px 56px;
            border-radius: 24px;
            text-align: center;
            max-width: 640px;
            width: 78%;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 24px 60px rgba(0, 0, 0, 0.45),
                0 0 35px rgba(155, 124, 255, 0.16);
            backdrop-filter: blur(14px);
        }

        .portal-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 24px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(155,124,255,0.7), rgba(78,224,193,0.45), transparent);
            -webkit-mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            mask:
                linear-gradient(#fff 0 0) content-box,
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .title {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #b99cff, #62f0d2);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status {
            font-size: 1.05rem;
            color: var(--text-sub);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .url-display {
            background: rgba(15, 17, 28, 0.9);
            padding: 20px 22px;
            border-radius: 14px;
            font-family: Consolas, "Courier New", monospace;
            font-size: 1.15rem;
            color: var(--accent-color);
            border: 1px solid rgba(155, 124, 255, 0.28);
            width: 100%;
            box-sizing: border-box;
            outline: none;
            margin-bottom: 30px;
            box-shadow:
                inset 0 2px 10px rgba(0, 0, 0, 0.45),
                0 0 18px rgba(155, 124, 255, 0.08);
            transition: 0.25s ease;
        }

        .url-display:focus {
            border-color: var(--accent-green);
            box-shadow:
                inset 0 2px 10px rgba(0, 0, 0, 0.45),
                0 0 18px rgba(78, 224, 193, 0.22);
        }

        .url-display::placeholder {
            color: #666a85;
        }

        .hint {
            color: #8f91a3;
            font-size: 0.92rem;
            line-height: 1.8;
            text-align: left;
            background: rgba(255, 255, 255, 0.035);
            border-radius: 14px;
            padding: 18px 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .hint b {
            color: #d8d2ff;
            font-weight: 700;
        }
    </style>
</head>

<body>
    <div class="portal-card">
        <div class="title">網頁傳送門</div>
        <div class="status" id="status-text">準備傳送至網站 [1/2]</div>

        <input
            type="text"
            class="url-display"
            id="url-text"
            placeholder="請輸入網址..."
        >

        <div class="hint">
            <b>手勢操作指引：</b><br>
            比出 OK / 點擊手勢 ➔ 模擬 <b>[ Enter ]</b>：正式進入/傳送至該網站<br>
            比出揮手手勢 ➔ 模擬 <b>[ Backspace ]</b>：在清單中切換下一個網站<br>
            頁面跳轉後 ➔ 模擬 <b>[ Alt + ← ] (向左揮)</b>：可直接退回本控制台
        </div>
    </div>

    <script>
        const urls = [
            "https://www.google.com",
            "https://web.ncku.edu.tw/"
        ];

        let currentIndex = 0;

        const urlText = document.getElementById("url-text");
        const statusText = document.getElementById("status-text");

        function updatePortalUI() {
            urlText.value = urls[currentIndex];
            statusText.textContent = `準備傳送至網站 [${currentIndex + 1}/${urls.length}]`;
            statusText.style.color = "";
        }

        function toggleTargetWebpage() {
            currentIndex = (currentIndex + 1) % urls.length;
            updatePortalUI();
        }

        function launchWebpage() {
            let targetUrl = urlText.value.trim();

            if (targetUrl === "") {
                targetUrl = urls[currentIndex];
            }

            if (
                !targetUrl.startsWith("http://") &&
                !targetUrl.startsWith("https://")
            ) {
                targetUrl = "https://" + targetUrl;
            }

            statusText.textContent = "正在進入網頁";
            statusText.style.color = "#4ee0c1";

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        }

        window.addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                launchWebpage();
            } else if (e.key === "Backspace") {
                if (document.activeElement === urlText && urlText.value.length > 0) {
                    return;
                }

                e.preventDefault();
                toggleTargetWebpage();
            }
        });

        updatePortalUI();
        window.focus();
    </script>
</body>
</html>
