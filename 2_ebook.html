<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電子書閱讀器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.1.5/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0b0c10; --card: #14161d;
            --border: rgba(255,255,255,0.07);
            --accent: #1D9E75; --text: #f5f6f9;
            --muted: #8f94a6; --paper: #fdf6e3;
        }
        body, html {
            width: 100%; height: 100%;
            background: var(--bg); color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; -webkit-font-smoothing: antialiased;
        }
        .top-bar {
            width: 88%; display: flex; align-items: center;
            gap: 12px; margin-bottom: 12px;
        }
        .upload-label {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 20px; border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card); color: var(--text);
            font-size: 0.85rem; font-weight: 500; cursor: pointer;
            white-space: nowrap; flex-shrink: 0;
            transition: border-color 0.2s, color 0.2s;
        }
        .upload-label:hover { border-color: var(--accent); color: var(--accent); }
        .book-title {
            font-size: 0.82rem; color: var(--muted);
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1;
        }
        #viewer-wrap {
            width: 88%; height: 72vh;
            background: var(--paper); border-radius: 8px;
            box-shadow: 0 10px 30px -5px rgba(0,0,0,0.6);
            overflow: hidden; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        #viewer { width: 100%; height: 100%; display: none; }
        .placeholder {
            text-align: center; color: #bbb;
            font-size: 0.85rem; line-height: 2;
        }
        .placeholder .icon {
            font-size: 2.5rem; display: block;
            margin-bottom: 8px; opacity: 0.35;
        }
        .loading-overlay {
            display: none; position: absolute; inset: 0;
            background: rgba(253,246,227,0.92);
            flex-direction: column;
            align-items: center; justify-content: center;
            font-size: 0.85rem; color: #666; z-index: 10; gap: 12px;
        }
        .loading-overlay.active { display: flex; }
        .spinner {
            width: 22px; height: 22px;
            border: 2px solid #ccc; border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-detail {
            font-size: 0.75rem; color: #999; font-family: "SF Mono", Consolas, monospace;
        }
        .nav-bar {
            width: 88%; margin-top: 14px;
            display: flex; align-items: center;
            justify-content: center; gap: 20px;
        }
        .nav-btn {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card); color: var(--text);
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0;
            transition: border-color 0.15s, color 0.15s;
            user-select: none;
        }
        .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
        .nav-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
        .page-info {
            font-size: 0.9rem; color: var(--muted);
            font-family: "SF Mono", Consolas, monospace;
            min-width: 120px; text-align: center;
        }
        .page-info b { color: var(--text); font-weight: 600; }
        .hint {
            margin-top: 10px; font-size: 0.72rem;
            color: var(--muted); text-align: center;
        }
        .hint code {
            background: rgba(255,255,255,0.07);
            padding: 1px 5px; border-radius: 3px;
            font-family: "SF Mono", Consolas, monospace; font-size: 0.7rem;
        }
    </style>
</head>
<body>

<div class="top-bar">
    <label class="upload-label" for="file-input">開啟 EPUB</label>
    <input type="file" id="file-input" accept=".epub" style="display:none">
    <span class="book-title" id="book-title">尚未載入書籍</span>
</div>

<div id="viewer-wrap">
    <div class="placeholder" id="placeholder">
        請上傳 EPUB 格式的電子書
    </div>
    <div id="viewer"></div>
    <div class="loading-overlay" id="loading-overlay">
        <div class="spinner"></div>
        <span id="loading-msg">載入書籍中...</span>
        <span class="loading-detail" id="loading-detail"></span>
    </div>
</div>

<div class="nav-bar">
    <button class="nav-btn" id="btn-prev" disabled>&#8592;</button>
    <span class="page-info" id="page-info">— / —</span>
    <button class="nav-btn" id="btn-next" disabled>&#8594;</button>
</div>

<div class="hint">
    鍵盤 <code>←</code> <code>→</code> 翻頁 &nbsp;·&nbsp;
    數字鍵 <code>1</code>–<code>5</code> 跳至 0 / 25 / 50 / 75 / 100%
</div>

<script>
let book = null, rendition = null;

// 全書累計頁數資料
// spinePageOffsets[i] = 第 i 個章節在全書的起始頁（0-based）
let spinePageOffsets = [];
let totalPages = 0;
let ready = false;
let currentGlobalPage = 1;

const viewerEl      = document.getElementById('viewer');
const placeholder   = document.getElementById('placeholder');
const loadingEl     = document.getElementById('loading-overlay');
const loadingMsg    = document.getElementById('loading-msg');
const loadingDetail = document.getElementById('loading-detail');
const pageInfo      = document.getElementById('page-info');
const btnPrev       = document.getElementById('btn-prev');
const btnNext       = document.getElementById('btn-next');

// 更新頁碼顯示
function setPage(globalPage) {
    currentGlobalPage = globalPage;
    pageInfo.innerHTML = '<b>' + globalPage + '</b> / ' + totalPages;
    btnPrev.disabled = (globalPage <= 1);
    btnNext.disabled = (globalPage >= totalPages);
}

// 從 relocated 事件計算全書頁碼
function onRelocated(location) {
    if (!ready) return;
    const spineIndex = location.start.index;
    const chapterPage = (location.start.displayed && location.start.displayed.page)
        ? location.start.displayed.page : 1;
    const globalPage = spinePageOffsets[spineIndex] + chapterPage;
    setPage(globalPage);
}

// 預渲染所有章節，取得各章頁數
// 做法：依序 display 每個章節，從 currentLocation().start.displayed.total 取頁數
async function buildPageIndex() {
    const spineItems = [];
    book.spine.each(item => spineItems.push(item));
    const total = spineItems.length;

    spinePageOffsets = new Array(total).fill(0);
    let cumulative = 1; // 全書從第 1 頁開始

    for (let i = 0; i < total; i++) {
        loadingDetail.textContent =
            '章節 ' + (i + 1) + ' / ' + total + '　掃描中...';

        // 渲染該章節
        await rendition.display(spineItems[i].href);

        // 等 displayed.total 穩定（有時需要一幀）
        await new Promise(r => setTimeout(r, 60));

        const loc = rendition.currentLocation();
        const chapterTotal = (loc && loc.start && loc.start.displayed)
            ? loc.start.displayed.total : 1;

        spinePageOffsets[i] = cumulative;
        cumulative += chapterTotal;
    }

    totalPages = cumulative - 1;

    // 跳回第一頁
    await rendition.display(spineItems[0].href);
    loadingEl.classList.remove('active');
    ready = true;

    const loc = rendition.currentLocation();
    if (loc && loc.start) onRelocated({ start: loc.start });
    else setPage(1);
}

// 跳至全書百分比
function goToPercent(pct) {
    if (!ready) return;
    const ratio      = Math.max(0, Math.min(1, pct / 100));
    const targetPage = Math.max(1, Math.min(totalPages, Math.round(ratio * (totalPages - 1)) + 1));

    // 找到對應的章節
    let spineIndex = 0;
    for (let i = spinePageOffsets.length - 1; i >= 0; i--) {
        if (spinePageOffsets[i] <= targetPage) { spineIndex = i; break; }
    }

    const spineItems = [];
    book.spine.each(item => spineItems.push(item));
    rendition.display(spineItems[spineIndex].href);
}

function handleKey(key) {
    if (!rendition) return;
    if      (key === 'ArrowRight') rendition.next();
    else if (key === 'ArrowLeft')  rendition.prev();
    else {
        const n = parseInt(key);
        if (!isNaN(n) && n >= 1 && n <= 5) goToPercent((n - 1) / 4 * 100);
    }
}

document.getElementById('file-input').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    document.getElementById('book-title').textContent = file.name;
    ready = false;
    totalPages = 0;
    spinePageOffsets = [];
    pageInfo.textContent = '— / —';
    btnPrev.disabled = true;
    btnNext.disabled = true;

    placeholder.style.display = 'none';
    viewerEl.style.display    = 'block';
    loadingMsg.textContent    = '載入書籍中...';
    loadingDetail.textContent = '';
    loadingEl.classList.add('active');

    const reader = new FileReader();
    reader.onload = function(ev) {
        if (rendition) rendition.destroy();

        book      = ePub(ev.target.result);
        rendition = book.renderTo('viewer', {
            width: '100%', height: '100%',
            flow: 'paginated', spread: 'none'
        });

        rendition.hooks.content.register(function(contents) {
            contents.addStylesheetRules({
                'body': {
                    'max-width':  '100% !important',
                    'padding':    '0 40px !important',
                    'overflow':   'hidden !important',
                    'box-sizing': 'border-box !important'
                },
                'img': {
                    'max-width':  '100% !important',
                    'max-height': '60vh !important',
                    'height':     'auto !important',
                    'object-fit': 'contain !important',
                    'display':    'block !important',
                    'margin':     '0 auto !important'
                },
                'p': { 'word-wrap': 'break-word !important' }
            });
            contents.window.addEventListener('keydown', ev2 => handleKey(ev2.key));
        });

        rendition.on('relocated', onRelocated);

        book.ready.then(() => {
            loadingMsg.textContent = '掃描全書頁數中...';
            return buildPageIndex();
        });

        rendition.display();
    };
    reader.readAsArrayBuffer(file);
});

btnPrev.addEventListener('click', () => { if (rendition) rendition.prev(); });
btnNext.addEventListener('click', () => { if (rendition) rendition.next(); });
window.addEventListener('keydown', e => handleKey(e.key));
</script>
</body>
</html>
