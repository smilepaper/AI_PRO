<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手勢控制多模態工作站</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --nav-bg: #14161d;
            --card-border: rgba(255, 255, 255, 0.04);
            --accent-color: #66fcf1; 
            --text-main: #f5f6f9;
            --text-muted: #8f94a6;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 頂部高級感分頁導覽列 (手勢控制時可選用，發表時也很好看) */
        .tab-bar {
            background: var(--nav-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 12px 0;
            z-index: 100;
        }

        .tab-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-btn.active {
            background: rgba(102, 252, 241, 0.08);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* 視窗貨櫃區：利用 3D 平移達到極其流暢的切換動畫 */
        .stage {
            flex-grow: 1;
            display: flex;
            width: 300%; /* 三個面板橫向排列 */
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            transform: translateX(0%);
        }

        .panel-wrapper {
            width: 33.3333%;
            height: 100%;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }

        /* 跨面板聯動：全域番茄鐘時間到強大警告層 */
        .global-alert {
            position: fixed; inset: 0;
            background: rgba(11, 12, 16, 0.85);
            backdrop-filter: blur(12px);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0; visibility: hidden;
            transition: all 0.4s ease;
        }

        .global-alert.active {
            opacity: 1; visibility: visible;
        }

        .alert-box {
            background: #1c1f26;
            padding: 40px 60px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255, 74, 74, 0.3);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .alert-title {
            font-size: 2rem; font-weight: 700; color: #ff4a4a; margin-bottom: 12px;
        }

        .alert-btn {
            margin-top: 25px; background: #ff4a4a; color: #fff;
            border: none; padding: 10px 24px; border-radius: 20px;
            cursor: pointer; font-weight: 600;
        }

        .global-hint {
            position: fixed; bottom: 15px; left: 20px;
            font-size: 0.75rem; color: var(--text-muted); font-family: monospace;
            z-index: 101; pointer-events: none;
        }

        .floating-orb {
            position: fixed;
            top: 50%;
            right: 0;
            width: 18px;
            height: 96px;
            border-radius: 18px 0 0 18px;
            transform: translateY(-50%);
            z-index: 8000;
            pointer-events: none;
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.95), rgba(102, 252, 241, 0.85) 45%, rgba(115, 137, 255, 0.85));
            box-shadow:
                0 0 18px rgba(102, 252, 241, 0.75),
                0 0 42px rgba(115, 137, 255, 0.35);
            transition:
                width 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                height 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                right 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                border-radius 0.55s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.35s ease;
            animation: sleepPulse 2.2s ease-in-out infinite;
        }

        .floating-orb.awake {
            right: 34px;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            animation: awakeFloat 3.4s ease-in-out infinite;
            box-shadow:
                0 0 26px rgba(102, 252, 241, 0.9),
                0 0 64px rgba(115, 137, 255, 0.48),
                inset 0 -12px 22px rgba(12, 18, 28, 0.32);
        }

        .orb-core {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            overflow: hidden;
        }

        .orb-core::before {
            content: "";
            position: absolute;
            width: 62%;
            height: 62%;
            top: 12%;
            left: 16%;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.55);
            filter: blur(8px);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .floating-orb.awake .orb-core::before {
            opacity: 1;
        }

        .orb-menu {
            position: absolute;
            inset: 0;
            opacity: 0;
            transform: scale(0.72) rotate(-12deg);
            transition:
                opacity 0.34s ease,
                transform 0.55s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .floating-orb.awake .orb-menu {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .orb-menu::before {
            content: "";
            position: absolute;
            width: 132px;
            height: 132px;
            right: -28px;
            top: 50%;
            border-radius: 50%;
            border: 1px solid rgba(102, 252, 241, 0.34);
            border-left-color: transparent;
            border-bottom-color: transparent;
            transform: translateY(-50%) rotate(135deg);
        }

        .orb-menu-item {
            position: absolute;
            right: 78px;
            top: -18px;
            min-width: 86px;
            height: 34px;
            padding: 0 12px;
            border-radius: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(20, 22, 29, 0.9);
            border: 1px solid rgba(102, 252, 241, 0.45);
            color: var(--text-main);
            font-size: 0.82rem;
            font-weight: 650;
            letter-spacing: 0;
            white-space: nowrap;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        }

        .orb-menu-item::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 8px;
            background: var(--accent-color);
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.8);
        }

        .orb-toast {
            position: fixed;
            right: 126px;
            top: calc(50% + 56px);
            z-index: 8001;
            padding: 10px 16px;
            border-radius: 18px;
            background: rgba(20, 22, 29, 0.92);
            border: 1px solid rgba(102, 252, 241, 0.36);
            color: var(--text-main);
            font-weight: 700;
            opacity: 0;
            transform: translate(12px, -50%) scale(0.96);
            pointer-events: none;
            transition:
                opacity 0.24s ease,
                transform 0.24s ease;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.38);
        }

        .orb-toast.active {
            opacity: 1;
            transform: translate(0, -50%) scale(1);
        }

        @keyframes sleepPulse {
            0%, 100% { filter: brightness(0.82); }
            50% { filter: brightness(1.24); }
        }

        @keyframes awakeFloat {
            0%, 100% { transform: translateY(-50%) translateX(0); }
            50% { transform: translateY(calc(-50% - 8px)) translateX(-2px); }
        }

        .cursor-orb {
            position: fixed;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(102, 252, 241, 1) 0%, rgba(102, 252, 241, 0.4) 70%, transparent 100%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            display: none;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.8);
            transform: translate(-50%, -50%);
            transition: width 0.15s, height 0.15s, background 0.15s, box-shadow 0.15s;
        }
        .cursor-orb.active { display: block; }
        .cursor-orb.clicking {
            width: 14px; height: 14px;
            background: radial-gradient(circle, rgba(255, 74, 74, 1) 0%, rgba(255, 74, 74, 0.4) 70%, transparent 100%);
            box-shadow: 0 0 20px rgba(255, 74, 74, 0.9);
        }
        .cursor-orb.scrolling {
            background: radial-gradient(circle, rgba(155, 124, 255, 1) 0%, rgba(155, 124, 255, 0.4) 70%, transparent 100%);
            box-shadow: 0 0 20px rgba(155, 124, 255, 0.9);
            border-radius: 10px; height: 35px;
        }
        :root {
            --draw-color: 255, 204, 0; /* 預設黃色 RGB */
            --draw-color-hex: #ffcc00;
        }
        .cursor-orb.drawing {
            background: radial-gradient(circle, rgba(var(--draw-color), 1) 0%, rgba(var(--draw-color), 0.4) 70%, transparent 100%);
            box-shadow: 0 0 15px rgba(var(--draw-color), 0.8);
            width: 12px; height: 12px;
        }
        .cursor-orb.erasing {
            background: radial-gradient(circle, rgba(200, 200, 200, 1) 0%, rgba(200, 200, 200, 0.4) 70%, transparent 100%);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            width: 40px; height: 40px;
        }

        #draw-canvas {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9000;
        }
    </style>
</head>
<body>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchPanel(0)">1. 隔空簡報播放 (Slides)</button>
        <button class="tab-btn" onclick="switchPanel(1)">2. 任務看板 (Kanban)</button>
        <button class="tab-btn" onclick="switchPanel(2)">3. 專注番茄鐘 (Timer)</button>
    </div>

    <div class="stage" id="main-stage">
        <div class="panel-wrapper"><iframe id="frame-presentation" src="1_presentation.html"></iframe></div>
        <div class="panel-wrapper"><iframe id="frame-kanban" src="2_kanban.html"></iframe></div>
        <div class="panel-wrapper"><iframe id="frame-pomodoro" src="3_pomodoro.html"></iframe></div>
    </div>

    <div class="global-alert" id="global-alert">
        <div class="alert-box">
            <div class="alert-title">⏰ Tomato Timer Time Up!</div>
            <div style="color: var(--text-muted);">演算法專注時段結束，請起立活動手部關節。</div>
            <button class="alert-btn" onclick="dismissAlert()">收到 (Dismiss)</button>
        </div>
    </div>

    <div class="global-hint">
        中控台快捷鍵: <code>[ PageUp ]</code> 上一面板 | <code>[ PageDown ]</code> 下一面板
    </div>

    <div class="floating-orb" id="floating-orb" aria-hidden="true">
        <div class="orb-core"></div>
        <div class="orb-menu">
            <div class="orb-menu-item" style="color:#ffcc00">1: 黃色 (Yellow)</div>
            <div class="orb-menu-item" style="color:#00ffcc">2: 青色 (Cyan)</div>
            <div class="orb-menu-item" style="color:#ff3366">3: 桃紅 (Pink)</div>
        </div>
    </div>
    <div class="orb-toast" id="orb-toast">Hello World</div>
    
    <div class="cursor-orb" id="cursor-orb"></div>
    <canvas id="draw-canvas"></canvas>

    <script>
        // === 語音回饋模組 ===
        const synth = window.speechSynthesis;
        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 1.1;
            synth.speak(utterance);
        }

        // === 鬧鐘音效模組 (Web Audio API) ===
        let alarmInterval = null;
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.4);
        }
        function startAlarm() {
            if (alarmInterval) return;
            playBeep();
            alarmInterval = setInterval(playBeep, 800);
        }
        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // === 畫筆模組 ===
        let canvas, ctx;
        let isDrawing = false;
        let lastDrawX = 0, lastDrawY = 0;
        
        const drawingColors = ['#ffcc00', '#00ffcc', '#ff3366'];
        const drawingColorRGB = ['255, 204, 0', '0, 255, 204', '255, 51, 102'];
        let currentDrawColor = drawingColors[0];

        function setDrawingColor(index) {
            currentDrawColor = drawingColors[index];
            if (ctx) {
                ctx.strokeStyle = currentDrawColor;
                ctx.shadowColor = currentDrawColor;
            }
            document.documentElement.style.setProperty('--draw-color', drawingColorRGB[index]);
            document.documentElement.style.setProperty('--draw-color-hex', currentDrawColor);
            
            const colorNames = ['黃色', '青色', '桃紅'];
            showOrbToast(`畫筆已切換：${colorNames[index]}`);
            setOrbAwake(false);
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('draw-canvas');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx = canvas.getContext('2d');
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 6;
            ctx.strokeStyle = currentDrawColor;
            ctx.shadowBlur = 10;
            ctx.shadowColor = currentDrawColor;
            
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        });

        let currentPanelIndex = 0;
        const totalPanels = 3;
        const stage = document.getElementById('main-stage');
        const tabs = document.querySelectorAll('.tab-btn');

        // 核心切換函數：讓畫面優雅滑動
        function switchPanel(index) {
            if (index < 0 || index >= totalPanels) return;
            currentPanelIndex = index;
            
            // 計算滑動百分比
            const offset = currentPanelIndex * -33.3333;
            stage.style.transform = `translateX(${offset}%)`;

            // 更新分頁按鈕高亮
            tabs.forEach((tab, i) => {
                if (i === currentPanelIndex) tab.classList.add('active');
                else tab.classList.remove('active');
            });

            // 轉移焦點，確保手勢指令能立刻送進子網頁
            setTimeout(() => {
                const frames = ['frame-presentation', 'frame-kanban', 'frame-pomodoro'];
                const activeFrame = document.getElementById(frames[currentPanelIndex]);
                if (activeFrame) activeFrame.contentWindow.focus();
            }, 100);
        }

        // 跨面板聯動：接收來自番茄鐘「時間到」的訊號
        window.addEventListener('message', function(event) {
            if (event.data === 'pomodoro-time-up') {
                document.getElementById('global-alert').classList.add('active');
                startAlarm();
            }
        });

        function dismissAlert() {
            stopAlarm();
            document.getElementById('global-alert').classList.remove('active');
            switchPanel(2); // 點選後自動帶使用者回去番茄鐘面板重設
        }

        // 中控台專屬鍵盤監聽（為了配合手勢大動作切換面板）
        window.addEventListener('keydown', function(e) {
            if (e.key === 'PageDown') {
                e.preventDefault();
                switchPanel((currentPanelIndex + 1) % totalPanels);
            } else if (e.key === 'PageUp') {
                e.preventDefault();
                switchPanel((currentPanelIndex - 1 + totalPanels) % totalPanels);
            } else {
                handleOrbKeyboard(e);
            }
        });
        // --- 串接 Python 手勢辨識 (WebSocket) ---
        const ws = new WebSocket('ws://localhost:8765');
        
        ws.onopen = function() {
            console.log('成功連接到 Python 手勢伺服器');
            // 可以透過介面提示使用者已連線
            document.querySelector('.global-hint').innerHTML += ' | <span style="color:#66fcf1;">AI 視覺已連線</span>';
        };

        const floatingOrb = document.getElementById('floating-orb');
        const orbToast = document.getElementById('orb-toast');
        let orbAwake = false;
        let toastTimer = null;

        function setOrbAwake(isAwake) {
            orbAwake = isAwake;
            floatingOrb.classList.toggle('awake', orbAwake);
            if (!orbAwake) hideOrbToast();
        }

        function toggleOrb() {
            setOrbAwake(!orbAwake);
        }

        function showOrbToast(message) {
            orbToast.textContent = message;
            orbToast.classList.add('active');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(hideOrbToast, 1600);
        }

        function hideOrbToast() {
            orbToast.classList.remove('active');
            clearTimeout(toastTimer);
            toastTimer = null;
        }

        function normalizeGesture(gesture) {
            return String(gesture || '').trim().toLowerCase();
        }

        function handleOrbGesture(gesture) {
            const normalizedGesture = normalizeGesture(gesture);

            if (normalizedGesture === 'ok') {
                toggleOrb();
                return true;
            }

            if (orbAwake) {
                if (normalizedGesture === 'one') { setDrawingColor(0); return true; }
                if (normalizedGesture === 'peace') { setDrawingColor(1); return true; }
                if (normalizedGesture === 'three') { setDrawingColor(2); return true; }
                
                if (normalizedGesture === 'like') {
                    showOrbToast('Hello World');
                    return true;
                }
                if (normalizedGesture === 'dislike') {
                    setOrbAwake(false);
                    return true;
                }
            }

            return false;
        }

        function handleOrbKeyboard(e) {
            const key = String(e.key || '').toLowerCase();

            if (key === 'o') {
                handleOrbGesture('ok');
            } else if (key === 'h') {
                handleOrbGesture('like');
            } else if (key === 'd') {
                handleOrbGesture('dislike');
            }
        }

        window.addEventListener('message', function(event) {
            if (event.data && event.data.type === 'orb-test-key') {
                handleOrbKeyboard({ key: event.data.key });
            }
        });

        function attachFrameKeyboard(frame) {
            try {
                frame.contentWindow.addEventListener('keydown', function(e) {
                    window.postMessage({ type: 'orb-test-key', key: e.key }, '*');
                });
            } catch (error) {
                console.warn('無法掛載 iframe 測試快捷鍵:', frame.id, error);
            }
        }

        function attachFrameKeyboardShortcuts() {
            const frames = ['frame-presentation', 'frame-kanban', 'frame-pomodoro'];
            frames.forEach((frameId) => {
                const frame = document.getElementById(frameId);
                if (!frame) return; // 加入防呆檢查，避免找不到 iframe 時造成腳本中斷
                
                attachFrameKeyboard(frame);
                frame.addEventListener('load', function() {
                    attachFrameKeyboard(frame);
                });
            });
        }

        attachFrameKeyboardShortcuts();

        // 游標球邏輯
        const cursorOrb = document.getElementById('cursor-orb');
        let cursorActive = false;
        let lastClickTime = 0;

        function simulateClick(x, y) {
            cursorOrb.classList.add('clicking');
            setTimeout(() => cursorOrb.classList.remove('clicking'), 200);

            const el = document.elementFromPoint(x, y);
            if (!el) return;

            const triggerEvents = (target, clientX, clientY, view) => {
                ['mousedown', 'mouseup', 'click'].forEach(eventType => {
                    const event = new MouseEvent(eventType, {
                        view: view, bubbles: true, cancelable: true, clientX, clientY
                    });
                    target.dispatchEvent(event);
                });
                if (target.tagName.toLowerCase() === 'input' || target.tagName.toLowerCase() === 'textarea') {
                    target.focus();
                }
            };

            if (el.tagName.toLowerCase() === 'iframe') {
                try {
                    const rect = el.getBoundingClientRect();
                    const iframeX = x - rect.left;
                    const iframeY = y - rect.top;
                    const innerEl = el.contentDocument.elementFromPoint(iframeX, iframeY);
                    if (innerEl) triggerEvents(innerEl, iframeX, iframeY, el.contentWindow);
                } catch (e) {
                    console.warn('跨域點擊 iframe 失敗', e);
                }
            } else {
                triggerEvents(el, x, y, window);
            }
        }

        // 加入冷卻時間 (Cooldown)，避免手勢一直觸發導致畫面瘋狂亂跳
        let lastGestureTime = 0;
        const cooldownMs = 1000; // 1秒內不重複觸發

        // 日誌節流，避免頻繁印出洗版
        let lastLogTime = 0;
        let lastScrollY = null; // 供滾動模式使用

        ws.onmessage = function(event) {
            const now = Date.now();
            const data = JSON.parse(event.data);
            const gesture = data.gesture;
            const normGesture = normalizeGesture(gesture);
            
            if (now - lastLogTime > 1000) {
                console.log('收到手勢指令:', gesture);
                lastLogTime = now;
            }

            // 處理游標啟動 (各種主要手勢皆可喚醒)
            if (['palm', 'open_palm', 'peace', 'little_finger', 'stop'].includes(normGesture)) {
                if (!cursorActive) {
                    cursorActive = true;
                    cursorOrb.classList.add('active');
                }
            }

            // 從 transform 中解析先前的 px, py 座標 (若沒有則預設 0)
            let px = 0, py = 0;
            const match = cursorOrb.style.transform.match(/translate3d\(calc\(([^p]+)px/);
            if (match) {
                px = parseFloat(match[1]) || 0;
                const matchY = cursorOrb.style.transform.match(/calc\(([^p]+)px - 50%\),\s*0\)/);
                py = matchY ? (parseFloat(matchY[1]) || 0) : 0;
            } else {
                px = window.innerWidth / 2;
                py = window.innerHeight / 2;
            }
            
            // 處理游標跟隨 (限指定手勢)
            if (cursorActive && data.x !== undefined && data.y !== undefined) {
                if (['palm', 'open_palm', 'peace', 'little_finger', 'stop'].includes(normGesture)) {
                    px = data.x * window.innerWidth;
                    py = data.y * window.innerHeight;
                    cursorOrb.style.transform = `translate3d(calc(${px}px - 50%), calc(${py}px - 50%), 0)`;
                }
            }

            // 狀態視覺切換
            cursorOrb.classList.toggle('drawing', normGesture === 'little_finger');
            cursorOrb.classList.toggle('erasing', normGesture === 'stop');

            // 發送座標至目前的子面板 (供面板內需要 hover 或 track 時使用)
            if (data.x !== undefined && data.y !== undefined) {
                const frames = ['frame-presentation', 'frame-kanban', 'frame-pomodoro'];
                const activeFrame = document.getElementById(frames[currentPanelIndex]);
                if (activeFrame && activeFrame.contentWindow) {
                    activeFrame.contentWindow.postMessage({ type: 'hand-track', x: data.x, y: data.y }, '*');
                }
            }



            // --- 功能 2：螢幕標註畫筆 (Little_Finger) 與 橡皮擦 (Stop) ---
            if (normGesture === 'little_finger' || normGesture === 'stop') {
                if (!isDrawing) {
                    isDrawing = true;
                    lastDrawX = px;
                    lastDrawY = py;
                } else {
                    ctx.globalCompositeOperation = normGesture === 'stop' ? 'destination-out' : 'source-over';
                    ctx.lineWidth = normGesture === 'stop' ? 40 : 6;
                    ctx.beginPath();
                    ctx.moveTo(lastDrawX, lastDrawY);
                    ctx.lineTo(px, py);
                    ctx.stroke();
                    lastDrawX = px;
                    lastDrawY = py;
                    
                    // Reset to normal
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.lineWidth = 6;
                }
            } else {
                isDrawing = false;
            }

            // 處理游標點擊 (fist)
            if (cursorActive && normGesture === 'fist') {
                if (now - lastClickTime > 800) { // 點擊獨立冷卻
                    lastClickTime = now;
                    simulateClick(px, py);
                }
            }

            // 如果還在冷卻時間內，則忽略其他面板切換等大動作指令
            if (now - lastGestureTime < cooldownMs) return;

            if (handleOrbGesture(gesture)) {
                lastGestureTime = now;
                return;
            }

            // 處理手勢：mute (關閉鬧鐘與全域警告層)
            if (normGesture === 'mute') {
                if (document.getElementById('global-alert').classList.contains('active')) {
                    dismissAlert();
                    lastGestureTime = now;
                }
            }

            // 處理手勢：timeout (開始/暫停番茄鐘)
            if (normGesture === 'timeout') {
                if (now - lastGestureTime > 1000) {
                    const activeFrame = document.getElementById('frame-pomodoro');
                    if (activeFrame && activeFrame.contentWindow) {
                        activeFrame.contentWindow.postMessage('pomodoro-toggle', '*');
                        showOrbToast('番茄鐘：開始 / 暫停');
                    }
                    lastGestureTime = now;
                    return;
                }
            }

            // 處理手勢：隔空簡報翻頁 (當選單未開啟且處於簡報面板時)
            if (!orbAwake && currentPanelIndex === 0 && ['one', 'three'].includes(normGesture)) {
                if (now - lastGestureTime > 1500) {
                    const activeFrame = document.getElementById('frame-presentation');
                    if (activeFrame && activeFrame.contentWindow) {
                        if (normGesture === 'one') {
                            activeFrame.contentWindow.postMessage({ type: 'slide-action', action: 'prev' }, '*');
                            showOrbToast('上一張投影片');
                        } else {
                            activeFrame.contentWindow.postMessage({ type: 'slide-action', action: 'next' }, '*');
                            showOrbToast('下一張投影片');
                        }
                    }
                    lastGestureTime = now;
                    return;
                }
            }



            if (gesture === 'Open_Palm') {
                // 布 (張開手) -> 關閉全域警告層
                if (document.getElementById('global-alert').classList.contains('active')) {
                    dismissAlert();
                    lastGestureTime = now;
                }
            }
        };

        ws.onerror = function() {
            console.error('無法連接到手勢伺服器，請確認 Python 程式是否已執行。');
        };
    </script>
</body>
</html>
